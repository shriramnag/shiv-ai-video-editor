name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: कोड चेकआउट करें
        uses: actions/checkout@v4

      - name: जावा १७ सेट करें
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: फ्लटर सेटअप करें
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: एंड्रॉयड एनवायरनमेंट ऑटो-जनरेट करें
        run: flutter create --platforms=android .

      - name: डिपेंडेंसी डाउनलोड करें
        run: flutter pub get

      - name: रिलीज एपीके बनाएं
        run: flutter build apk --release --no-tree-shake-icons

      - name: तैयार एपीके अपलोड करें
        uses: actions/upload-artifact@v4
        with:
          name: Shiv-AI-Editor-APK
          path: build/app/outputs/flutter-apk/app-release.apk
