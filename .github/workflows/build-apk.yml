name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: कोड चेकआउट करें
        uses: actions/checkout@v4

      - name: जावा 17 सेटअप करें
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: फ्लटर सेटअप करें
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: मिसिंग एंड्रॉयड फाइल्स जनरेट करें
        run: flutter create . --platforms=android --org com.shivai.editor

      - name: पैकेज डाउनलोड करें
        run: flutter pub get

      - name: एपीके बिल्ड करें
        run: flutter build apk --release --no-tree-shake-icons

      - name: तैयार एपीके अपलोड करें
        uses: actions/upload-artifact@v4
        with:
          name: Shiv-AI-Pro-Editor-APK
          path: build/app/outputs/flutter-apk/*.apk
          
